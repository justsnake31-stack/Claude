<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сравнение распознавания</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f3f5f4;--surface:#fff;--fg:#17201d;--muted:#5d6b66;--line:#dfe5e2;--accent:#0f7a5c;--good:#2f6f4f;--good-bg:#e8f4ee;--bad:#b42318;--bad-bg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#111816;--surface:#19221f;--fg:#e7eeeb;--muted:#97a7a1;--line:#2a3632;--accent:#3cc497;--good:#7fd3a8;--good-bg:#16302a;--bad:#ff7b70;--bad-bg:#3b1a18;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}p{margin:0;color:var(--muted)}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:12px 16px;display:inline-block;cursor:pointer}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}

@media (max-width:520px){.cols{grid-template-columns:1fr}}

.col img{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff}

</head>
<body>
<div class="wrap">
  <h1>Сравнение: A (сейчас) и Б (по границам наклейки)</h1>
  <p><b>A</b> — как в приложении: ищет текст, выравнивает, чёрно-белая очистка. <b>Б</b> — находит белую наклейку по краям, вырезает её по контуру и читает обычное серое изображение. Приложение это не меняет.</p>
  <div><label class="btn" for="f">Выбрать фото для теста</label><input type="file" id="f" accept="image/*" multiple></div>
  <p id="st"></p>
  <div class="tot" id="tot" hidden></div>
  <div id="out" style="display:flex;flex-direction:column;gap:14px"></div>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDate = d => `${pad(d.getDate())}.${pad(d.getMonth()+1)}`;
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseExp = s => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/.exec(s); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3], m[4]!=null?+m[4]:23, m[5]!=null?+m[5]:59); };
const WHITELIST = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдеёжзийклмнопрстуфхцчшщъыьэюя0123456789.,:;/-+()\"«»№ ";

// ---------- image helpers ----------
async function loadBitmap(file){
  if (window.createImageBitmap){
    try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch(e){}
    try { return await createImageBitmap(file); } catch(e){}
  }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("img")); }; im.src = u; });
}
const mkCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const ctx2d = c => c.getContext("2d", { willReadFrequently: true });
function scaled(src, maxSide){
  const W = src.naturalWidth || src.width, H = src.naturalHeight || src.height, k = Math.min(1, maxSide / Math.max(W, H));
  const c = mkCanvas(W * k, H * k), g = ctx2d(c); g.imageSmoothingQuality = "high"; g.drawImage(src, 0, 0, c.width, c.height); return c;
}
function grayOf(c){
  const d = ctx2d(c).getImageData(0, 0, c.width, c.height).data, n = c.width * c.height, gr = new Uint8Array(n), sat = new Uint8Array(n);
  for (let i = 0, j = 0; i < n; i++, j += 4){
    const r = d[j], g = d[j+1], b = d[j+2];
    gr[i] = (r * 77 + g * 150 + b * 29) >> 8;
    sat[i] = Math.max(r, g, b) - Math.min(r, g, b);
  }
  return { w: c.width, h: c.height, gr, sat };
}
// Bradley local threshold: copes with glare and shadows on the sticker
function binarize(G, win, t, paperK = 0.7){
  const { w, h, gr } = G, I = new Float64Array((w + 1) * (h + 1)), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++){ let row = 0; for (let x = 0; x < w; x++){ row += gr[y*w+x]; I[(y+1)*(w+1)+x+1] = I[y*(w+1)+x+1] + row; } }
  const s = Math.max(4, win >> 1);
  // brightness of the sticker paper: 92th percentile; areas much darker than it are not paper
  const hist = new Uint32Array(256); for (let i = 0; i < gr.length; i += 3) hist[gr[i]]++;
  let acc = 0, p92 = 255; const lim = gr.length / 3 * 0.92; for (let v = 0; v < 256; v++){ acc += hist[v]; if (acc >= lim){ p92 = v; break; } }
  const paper = paperK ? p92 * paperK : 0;
  for (let y = 0; y < h; y++){
    const y0 = Math.max(0, y - s), y1 = Math.min(h, y + s + 1);
    for (let x = 0; x < w; x++){
      const x0 = Math.max(0, x - s), x1 = Math.min(w, x + s + 1);
      const sum = I[y1*(w+1)+x1] - I[y0*(w+1)+x1] - I[y1*(w+1)+x0] + I[y0*(w+1)+x0];
      const area = (x1 - x0) * (y1 - y0);
      // ink = darker than its surroundings AND the surroundings are paper-bright (drops background clutter)
      out[y*w+x] = gr[y*w+x] * area < sum * (1 - t) && sum > paper * area ? 0 : 255; // 0 = ink
    }
  }
  return out;
}
function binToCanvas(bin, w, h){
  const c = mkCanvas(w, h), g = ctx2d(c), im = g.createImageData(w, h), d = im.data;
  for (let i = 0, j = 0; i < bin.length; i++, j += 4){ d[j] = d[j+1] = d[j+2] = bin[i]; d[j+3] = 255; }
  g.putImageData(im, 0, 0); return c;
}
// rotate around the centre, keep everything, fill with white
function rotated(src, deg, scale = 1){
  const a = deg * Math.PI / 180, cs = Math.abs(Math.cos(a)), sn = Math.abs(Math.sin(a));
  const w = src.width * scale, h = src.height * scale;
  const c = mkCanvas(w * cs + h * sn, w * sn + h * cs), g = ctx2d(c);
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.imageSmoothingQuality = "high";
  g.translate(c.width / 2, c.height / 2); g.rotate(a); g.drawImage(src, -w / 2, -h / 2, w, h); return c;
}

// Find sticker-like areas: blocks with lots of sharp dark-on-light strokes (printed text / barcode).
function findLabels(img){
  const sm = scaled(img, 640), G = grayOf(sm), { w, h, gr } = G, C = 8;
  const cw = Math.floor(w / C), ch = Math.floor(h / C), cell = new Uint8Array(cw * ch);
  for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++){
    let edges = 0, mx = 0, sum = 0;
    for (let y = cy*C; y < cy*C + C; y++) for (let x = cx*C; x < cx*C + C; x++){
      const i = y*w + x, v = gr[i]; sum += v; if (v > mx) mx = v;
      if (x + 1 < w && y + 1 < h && Math.abs(v - gr[i+1]) + Math.abs(v - gr[i+w]) > 40) edges++;
    }
    cell[cy*cw + cx] = edges >= 7 && mx > 140 && sum / (C*C) > 70 ? 1 : 0;
  }
  // close small gaps between text lines, then connected components
  const dil = new Uint8Array(cw * ch);
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) if (cell[y*cw+x])
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ const X = x+dx, Y = y+dy; if (X>=0 && Y>=0 && X<cw && Y<ch) dil[Y*cw+X] = 1; }
  const lab = new Int32Array(cw * ch).fill(-1), comps = [];
  for (let i = 0; i < dil.length; i++) if (dil[i] && lab[i] < 0){
    const st = [i]; lab[i] = comps.length; let n = 0, core = 0, x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    while (st.length){ const k = st.pop(), x = k % cw, y = (k / cw) | 0; n++; core += cell[k];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const X = x+dx, Y = y+dy; if (X>=0 && Y>=0 && X<cw && Y<ch){ const q = Y*cw+X; if (dil[q] && lab[q] < 0){ lab[q] = comps.length; st.push(q); } } } }
    const area = (x1 - x0 + 1) * (y1 - y0 + 1);
    comps.push({ core, score: core * Math.min(1, 2 * core / area), x0, y0, x1, y1 });
  }
  const k = (img.naturalWidth || img.width) / w;
  return comps.filter(c => c.core >= 5 && (c.x1 - c.x0 + 1) * (c.y1 - c.y0 + 1) < cw * ch * 0.6)
    .sort((a, b) => b.score - a.score).slice(0, 2)
    .map(c => { const pw = (c.x1 - c.x0 + 1) * C, ph = (c.y1 - c.y0 + 1) * C, m = 0.08 * Math.max(pw, ph) + 6;
      return { x: Math.max(0, (c.x0*C - m) * k), y: Math.max(0, (c.y0*C - m) * k), w: (pw + 2*m) * k, h: (ph + 2*m) * k }; });
}

// Keep only letter-sized ink blobs (drops container edges, shadows, specks). Returns filtered binary + text bbox.
function letters(bin, w, h){
  const lab = new Int32Array(w * h).fill(-1), keep = new Uint8Array(w * h).fill(255), st = [];
  let bx0 = w, by0 = h, bx1 = -1, by1 = -1, n = 0; const hs = [];
  for (let i = 0; i < bin.length; i++){
    if (bin[i] || lab[i] >= 0) continue;
    const px = []; st.push(i); lab[i] = i; let x0 = w, y0 = h, x1 = -1, y1 = -1;
    while (st.length){ const k = st.pop(), x = k % w, y = (k / w) | 0; px.push(k);
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){ const X = x+dx, Y = y+dy;
        if (X >= 0 && Y >= 0 && X < w && Y < h){ const q = Y*w+X; if (!bin[q] && lab[q] < 0){ lab[q] = i; st.push(q); } } } }
    const cw = x1 - x0 + 1, chh = y1 - y0 + 1, fill = px.length / (cw * chh);
    if (chh >= Math.max(3, h * 0.012) && chh <= h * 0.2 && cw <= w * 0.25 && cw <= chh * 6 && fill > 0.08 && fill < 0.95 && x0 > 0 && y0 > 0 && x1 < w - 1 && y1 < h - 1){
      for (const k of px) keep[k] = 0; n++; hs.push(chh);
      if (x0 < bx0) bx0 = x0; if (y0 < by0) by0 = y0; if (x1 > bx1) bx1 = x1; if (y1 > by1) by1 = y1;
    }
  }
  hs.sort((a, b) => a - b);
  return { bin: keep, n, medH: hs.length ? hs[hs.length >> 1] : 0, box: n ? { x0: bx0, y0: by0, x1: bx1, y1: by1 } : null };
}
// The main block of text: letters glued together by smearing ~1 letter wide / half a letter tall; keep the heaviest block.
function mainBlock(L, w, h){
  const rx = Math.max(2, Math.round(L.medH * 1.2)), ry = Math.max(1, Math.round(L.medH * 0.6));
  // horizontal then vertical dilation via running sums
  const a = new Uint8Array(w * h), b = new Uint8Array(w * h);
  for (let y = 0; y < h; y++){ let run = 0; for (let x = -rx; x < w; x++){ if (x + rx < w && !L.bin[y*w+x+rx]) run++; if (x - rx - 1 >= 0 && !L.bin[y*w+x-rx-1]) run--; if (x >= 0) a[y*w+x] = run > 0 ? 1 : 0; } }
  for (let x = 0; x < w; x++){ let run = 0; for (let y = -ry; y < h; y++){ if (y + ry < h && a[(y+ry)*w+x]) run++; if (y - ry - 1 >= 0 && a[(y-ry-1)*w+x]) run--; if (y >= 0) b[y*w+x] = run > 0 ? 1 : 0; } }
  const lab = new Int32Array(w * h).fill(-1), mass = [], boxes = [], st = [];
  for (let i = 0; i < b.length; i++) if (b[i] && lab[i] < 0){
    const id = mass.length; let m = 0, x0 = w, y0 = h, x1 = -1, y1 = -1; st.push(i); lab[i] = id;
    while (st.length){ const k = st.pop(), x = k % w, y = (k / w) | 0; if (!L.bin[k]) m++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (const q of [k - 1, k + 1, k - w, k + w]) if (q >= 0 && q < b.length && b[q] && lab[q] < 0 && Math.abs((q % w) - x) <= 1){ lab[q] = id; st.push(q); } }
    mass.push(m); boxes.push({ x0, y0, x1, y1 });
  }
  if (!mass.length) return null;
  let best = 0; mass.forEach((m, i) => { if (m > mass[best]) best = i; });
  const out = new Uint8Array(w * h).fill(255);
  for (let i = 0; i < out.length; i++) if (!L.bin[i] && lab[i] === best) out[i] = 0;
  return { bin: out, box: boxes[best] };
}

// Straighten: the angle at which rows of ink give the sharpest horizontal profile (text lines).
function skewAngle(bin, w, h){
  const pts = []; const step = Math.max(1, Math.round(Math.sqrt(w * h / 60000)));
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) if (!bin[y*w+x]) pts.push(x - w/2, y - h/2);
  if (pts.length < 40) return 0;
  const R = Math.ceil(Math.hypot(w, h)) + 2, bins = new Float64Array(2 * R);
  const score = deg => { const a = deg * Math.PI / 180, s = Math.sin(a), c = Math.cos(a); bins.fill(0);
    for (let i = 0; i < pts.length; i += 2) bins[(R + (-pts[i] * s + pts[i+1] * c) / step) | 0]++;
    let v = 0; for (let i = 0; i < bins.length; i++) v += bins[i] * bins[i]; return v; };
  let best = 0, bv = -1;
  for (let d = -88; d <= 90; d += 3){ const v = score(d); if (v > bv){ bv = v; best = d; } }
  for (let d = best - 2.5; d <= best + 2.5; d += 0.5){ const v = score(d); if (v > bv){ bv = v; best = d; } }
  return best;
}

// Crop → straighten → enlarge so letters are big enough → clean binary image ready for OCR
function prepCrop(img, box){
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  const bw = Math.min(box.w, W - box.x), bh = Math.min(box.h, H - box.y);
  const k = Math.min(3, 1400 / Math.max(bw, bh));   // normalise: same working size for any camera
  const c = mkCanvas(bw * k, bh * k); const g = ctx2d(c); g.imageSmoothingQuality = "high";
  g.drawImage(img, box.x, box.y, bw, bh, 0, 0, c.width, c.height);
  // estimate skew on a small copy, using letters only
  const sm = scaled(c, 600), sg = grayOf(sm), sb = binarize(sg, Math.round(sm.width / 10), 0.18, 0);
  const L = letters(sb, sm.width, sm.height);
  const ang = L.n >= 8 ? skewAngle(L.bin, sm.width, sm.height) : skewAngle(sb, sm.width, sm.height);
  const G = grayOf(c);
  const binArr = binarize(G, Math.round(Math.max(c.width, c.height) / 14), 0.16, 0);
  const bin = binToCanvas(binArr, c.width, c.height);
  // contrast-stretched grayscale: better than black/white for blurry shots
  const hist = new Uint32Array(256); for (const v of G.gr) hist[v]++;
  let lo = 0, hi = 255, acc = 0; const n = G.gr.length;
  for (let v = 0; v < 256; v++){ acc += hist[v]; if (acc < n * 0.02) lo = v; if (acc < n * 0.97) hi = v; }
  const g2 = ctx2d(c), im = g2.getImageData(0, 0, c.width, c.height), d = im.data, sc = 255 / Math.max(20, hi - lo);
  for (let i = 0, j = 0; i < n; i++, j += 4){ const v = Math.max(0, Math.min(255, (G.gr[i] - lo) * sc)); d[j] = d[j+1] = d[j+2] = v; }
  g2.putImageData(im, 0, 0);
  // rotate both, then cut to the area that holds letters (drops container edges around the sticker)
  let rb = Math.abs(ang) < 0.5 ? bin : rotated(bin, -ang), rg = Math.abs(ang) < 0.5 ? c : rotated(c, -ang);
  const s2 = scaled(rb, 700), g3 = grayOf(s2), b3 = new Uint8Array(g3.gr.length);
  for (let i = 0; i < b3.length; i++) b3[i] = g3.gr[i] < 128 ? 0 : 255;
  const L2 = letters(b3, s2.width, s2.height);
  if (L2.n >= 6){
    const MB = mainBlock(L2, s2.width, s2.height);
    if (MB){
      const f = rb.width / s2.width, m = Math.max(L2.medH * 0.8, 4) * f;
      const x0 = Math.max(0, MB.box.x0 * f - m), y0 = Math.max(0, MB.box.y0 * f - m);
      const x1 = Math.min(rb.width, (MB.box.x1 + 1) * f + m), y1 = Math.min(rb.height, (MB.box.y1 + 1) * f + m);
      const cut = src => { const o = mkCanvas(x1 - x0, y1 - y0), og = ctx2d(o); og.fillStyle = "#fff"; og.fillRect(0, 0, o.width, o.height); og.drawImage(src, x0, y0, x1 - x0, y1 - y0, 0, 0, o.width, o.height); return o; };
      // binary version: keep only letters of the main block (full resolution)
      const gg = grayOf(rb), full = new Uint8Array(gg.gr.length);
      for (let i = 0; i < full.length; i++){ const x = i % rb.width, y = (i / rb.width) | 0;
        full[i] = gg.gr[i] < 128 && x >= x0 && x < x1 && y >= y0 && y < y1 ? 0 : 255; }
      const LF = letters(full, rb.width, rb.height);
      rb = cut(binToCanvas(LF.n >= 6 ? LF.bin : full, rb.width, rb.height)); rg = cut(rg);
    }
  }
  return { canvas: rb, gray: rg, angle: ang };
}
function wholePhoto(img){
  const c = scaled(img, 2000), G = grayOf(c);
  return binToCanvas(binarize(G, Math.round(c.width / 12), 0.16, 0), c.width, c.height);
}

async function ocr(w, canvas, psm){
  await w.setParameters({ tessedit_pageseg_mode: String(psm) });
  const { data } = await w.recognize(canvas);
  return { text: data.text || "", conf: data.confidence || 0 };
}

// How believable is a result: real dates with times and a readable product name.
function quality(r){
  return Math.min(3, r.dates) * 3 + Math.min(3, r.timed) * 2 + r.nameScore * 2 + r.conf / 40;
}

async function recognizeFile(w, file){
  const img = await loadBitmap(file);
  const big = scaled(img, 3000); img.close && img.close();
  let best = null;
  const tryOne = async (canvas, psm) => {
    const o = await ocr(w, canvas, psm), r = parseLabel(o.text);
    r.conf = o.conf; r.q = quality(r);
    if (window.__ocrLog) window.__ocrLog.push({ psm, q: +r.q.toFixed(1), conf: Math.round(o.conf), text: o.text });
    if (!best || r.q > best.q){ best = r; best.preview = canvas.toDataURL("image/jpeg", 0.8); }
    return r;
  };
  const good = () => best && best.timed >= 2 && best.nameScore >= 1;
  for (const box of findLabels(big)){
    const p = prepCrop(big, box);
    await tryOne(p.canvas, 6);
    if (good()) break;
    await tryOne(p.gray, 6);                         // blurry photo: grayscale reads better
    if (good()) break;
    await tryOne(rotated(p.canvas, 180), 6);       // label may be upside down
    if (good()) break;
    await tryOne(p.canvas, 11);                      // sparse text mode
    if (good()) break;
  }
  if (!good()) await tryOne(wholePhoto(big), 11);
  big.width = big.height = 0; // free memory early on iPhone
  return best;
}

// ---- parsing the label text ----
function fixDigits(s){
  // typical OCR confusions next to numbers

  const st = findStickers(big);
  for (const R0 of st){
    let cut = cutSticker(big, R0);
    cut = paperEdges(cut);
    const g = grayStretch(cut);
    await tryOne(g, 6, "B:gray"); if (good()) break;
    await tryOne(rotated(g, 180), 6, "B:gray180"); if (good()) break;
    await tryOne(g, 4, "B:gray psm4"); if (good()) break;
  }
  if (!best){ best = parseLabel(""); best.q = 0; }
  best.stickers = st.length; best.tries = tries;
  big.width = big.height = 0;
  return best;
}


// ===== lab UI =====
let worker = null;
async function getW(){
  if (worker) return worker;
  $("st").textContent = "Загружаю распознавание (один раз)…";
  worker = await Tesseract.createWorker("rus", 1);
  await worker.setParameters({ preserve_interword_spaces: "1", tessedit_char_whitelist: WHITELIST, user_defined_dpi: "300" });
  return worker;
}
async function runBoth(file){
  const w = await getW();
  let t = performance.now(); const A = await recognizeFile(w, file); A.ms = performance.now() - t;
  t = performance.now(); const Bres = await recognizeB(w, file, true); Bres.ms = performance.now() - t;
  return { A, B: Bres };
}
window.labRun = runBoth;
window.__lab = { findStickers, cutSticker, loadBitmap, scaled, grayStretch, grayOf, otsu };
const show = r => r.expires ? (() => { const d = parseExp(r.expires); return `${fmtDate(d)} ${fmtTime(d)}`; })() : "—";
let tot = { n: 0, aD: 0, bD: 0, aT: 0, bT: 0 };
function col(title, r, win){
  const c = document.createElement("div"); c.className = "col" + (win ? " win" : "");
  c.innerHTML = `<h3></h3><div><span class="k">Название: </span><span class="v n"></span></div><div><span class="k">Годен до: </span><span class="v e"></span></div><div class="k t"></div>`;
  c.querySelector("h3").textContent = title; c.querySelector(".n").textContent = r.name || "—"; c.querySelector(".e").textContent = show(r);
  c.querySelector(".t").textContent = `${(r.ms/1000).toFixed(1)} с · уверенность ${Math.round(r.conf||0)}${r.stickers!=null ? " · наклеек найдено: " + r.stickers : ""}`;
  if (r.preview){ const im = document.createElement("img"); im.src = r.preview; im.alt = "Что читал алгоритм"; c.append(im); }
  const d = document.createElement("details"); d.innerHTML = "<summary>сырой текст</summary>"; const pre = document.createElement("div"); pre.className = "mono"; pre.textContent = r.raw || ""; d.append(pre); c.append(d);
  return c;
}
$("f").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  for (let i = 0; i < files.length; i++){
    $("st").textContent = `Обрабатываю ${i+1} из ${files.length}…`;
    const card = document.createElement("div"); card.className = "card";
    const th = document.createElement("img"); th.className = "thumb"; th.src = URL.createObjectURL(files[i]); th.alt = files[i].name; card.append(th);
    $("out").prepend(card);
    try {
      const { A, B } = await runBoth(files[i]);
      const cols = document.createElement("div"); cols.className = "cols";
      cols.append(col("A — сейчас", A, A.q > B.q + 0.5), col("Б — по границам наклейки", B, B.q > A.q + 0.5)); card.append(cols);
      tot.n++; tot.aD += !!A.expires; tot.bD += !!B.expires; tot.aT += A.ms; tot.bT += B.ms;
      $("tot").hidden = false;
      $("tot").innerHTML = `<span>Фото: ${tot.n}</span><span>A нашёл срок: ${tot.aD} · ср. ${(tot.aT/tot.n/1000).toFixed(1)} с</span><span>Б нашёл срок: ${tot.bD} · ср. ${(tot.bT/tot.n/1000).toFixed(1)} с</span>`;
    } catch(err){ const p = document.createElement("p"); p.textContent = "Ошибка: " + err.message; card.append(p); }
  }
  $("st").textContent = "Готово. Сверьте сроки с фото: зелёным подсвечен вариант, который сам алгоритм считает более надёжным.";
};
})();
